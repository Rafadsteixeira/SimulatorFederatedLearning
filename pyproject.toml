[project]
name = "simulator-federated-learning"
version = "0.1.0"
description = "Simulador de aprendizado federado em infraestrutura de borda com politicas Agno auditaveis."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "agno>=2.8,<2.9",
    "flwr[simulation]>=1.32,<1.33",
    "groq>=1.6,<2",
    "matplotlib>=3.11,<4",
    "networkx>=3.6,<4",
    "numpy>=2.5,<3",
    "pillow>=12.3,<13",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "torch>=2.13,<2.14",
    "torchvision>=0.28,<0.29",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
